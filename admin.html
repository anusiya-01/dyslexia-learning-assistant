<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>
<h1>Admin Dashboard</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>Level</th>
        <th>Accuracy</th>
        <th>Speed</th>
        <th>Time Taken</th>
    </tr>
    {% for row in results %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
    </tr>
    {% endfor %}
    
</table>

</body>
</html>
