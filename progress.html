<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Progress</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef5ff;
            color: #26324a;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            text-align: center;
        }

        h1 {
            font-size: 36px;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.10);
        }

        .result {
            padding: 15px;
            margin: 12px 0;
            background: #f5f8ff;
            border-radius: 12px;
            text-align: left;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            border-radius: 25px;
            text-decoration: none;
            color: #26324a;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏆 My Progress</h1>

    <div class="card">

        {% if results %}

            {% for result in results %}

                <div class="result">
                    <strong>Level:</strong> {{ result[1] }} <br>
                    <strong>Accuracy:</strong> {{ result[2] }} <br>
                    <strong>Speed:</strong> {{ result[3] }} <br>
                    <strong>Time:</strong> {{ result[4] }}
                </div>

            {% endfor %}

        {% else %}

            <p>No reading results available yet.</p>

        {% endif %}

    </div>

    <a href="/" class="back">🏠 Back to Home</a>

</div>

</body>
</html>
