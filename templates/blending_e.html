<!DOCTYPE html>
<html>
<head>
    <title>E + B Blending</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #ffd6e2;
        }

        .blend-area {
            position: relative;
            width: 90%;
            max-width: 900px;
            height: 350px;
            margin: 50px auto 20px;
            overflow: hidden;
        }

        .letter {
            position: absolute;
            top: 90px;
            font-size: 100px;
            font-weight: bold;
            transition: all 1.5s ease-in-out;
        }

        #e {
            left: 80px;
            color: #e91e63;
        }

        #b {
            right: 80px;
            color: #673ab7;
        }

        .arrow {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            opacity: 0;
        }

        .result {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            font-size: 105px;
            font-weight: bold;
            color: #ff5722;
            transition: transform 0.7s ease;
        }

        .join-button {
            padding: 15px 35px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background: #8e44ad;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 8px #999;
        }

        .join-button:hover {
            background: #6c3483;
        }
    </style>
</head>

<body>
    <div class="combination-buttons">
    <button onclick="selectLetter('B')">B</button>
    <button onclick="selectLetter('C')">C</button>
    <button onclick="selectLetter('D')">D</button>
    <button onclick="selectLetter('F')">F</button>
    <button onclick="selectLetter('G')">G</button>
    <button onclick="selectLetter('M')">M</button>
    <button onclick="selectLetter('N')">N</button>
    <button onclick="selectLetter('P')">P</button>
    <button onclick="selectLetter('R')">R</button>
    <button onclick="selectLetter('S')">S</button>
    <button onclick="selectLetter('T')">T</button>
    
    
    
</div>

    <div class="blend-area">

        <div class="letter" id="e">E</div>

        <div class="arrow" id="arrow">➜</div>

        <div class="letter" id="b">B</div>

        <div class="result" id="result">EB</div>

    </div>

    <button class="join-button" onclick="joinLetters()">
        🌟 Let's Join!
    </button>
    <script>
    let selectedLetter = "B";

    function selectLetter(letter) {
        selectedLetter = letter;

        const e = document.getElementById("e");
        const b = document.getElementById("b");
        const arrow = document.getElementById("arrow");
        const result = document.getElementById("result");

        b.innerText = letter;
        result.innerText = "E" + letter;

        e.style.left = "80px";
        b.style.right = "80px";

        e.style.opacity = "1";
        b.style.opacity = "1";
        arrow.style.opacity = "0";
        result.style.transform = "translateX(-50%) scale(0)";

        // இங்கே AUDIO எதுவும் இல்லை.
        // B/C/D touch செய்தால் sound வராது.
    }

    function joinLetters() {

        const e = document.getElementById("e");
        const b = document.getElementById("b");
        const arrow = document.getElementById("arrow");
        const result = document.getElementById("result");

        // E + selected consonant
        const combination = "e" + selectedLetter.toLowerCase();

        // JOIN button அழுத்திய பிறகு மட்டும் audio
        const audio = new Audio(
            "/static/sounds/" + combination + ".mp3"
        );

        audio.volume = 1.0;
        audio.play();

        // Joining animation
        arrow.style.opacity = "1";

        e.style.left = "42%";
        b.style.right = "42%";

        setTimeout(function () {

            e.style.opacity = "0";
            b.style.opacity = "0";
            arrow.style.opacity = "0";

            result.style.transform =
                "translateX(-50%) scale(1)";

        }, 1500);
    }
</script>

    
</body>
</html>
