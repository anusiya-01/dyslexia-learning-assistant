<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

<h2>Reset your code</h2>

<form action="/forgot_password" method="POST">
    <label>your name:</label><br>
    <input type="text" name="name" value="{{ name }}" required><br><br>

    <label>new code:</label><br>
    <input type="text" name="new_code" required><br><br>

    <button type="submit">Reset & Continue</button>
</form>

</body>
</html>
