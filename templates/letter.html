    0%   { transform: translateY(0); }

<body>

    <div class="letter">
        A  a
    </div>
    <div class="letter">
    A  a
</div>

<button onclick="playIntro()">🔤 This is Letter A</button>
<button onclick="playSound()">🔊 Hear the Sound</button>
<button onclick="startRecording()">🎤 Record My Voice</button>
<div id="myRecording"></div>
<div id="result"></div>
<div id="appreciation"></div>

<audio id="repeatSound">
    <source src="static/sounds/a_repeat.mp3" type="audio/mpeg">
</audio>
    <audio id="aSound">
        <source src="static/sounds/a_sound.mp3" type="audio/mp3">
</audio>

<script>

function playIntro() {
    let audio = new Audio("static/sounds/a_intro.mp3");

    audio.play();
}

function playSound() {
    let audio = document.getElementById("aSound");
    let letter = document.querySelector(".letter");

    audio.currentTime = 0;
    audio.volume = 1.0;
    audio.play();

    letter.classList.remove("animate");
    void letter.offsetWidth;
    letter.classList.add("animate");
}
let recognition;
let mediaRecorder;
let audioChunks = [];
function showResult(score) {

    const result = document.getElementById("result");
    const appreciation = document.getElementById("appreciation");

    result.innerText = "Score: " + score + "%";

    if (score >= 90) {
        appreciation.innerText = "🌟 Excellent! Perfect pronunciation!";
    }
    else if (score >= 80) {
        appreciation.innerText = "👏 Very Good! Keep it up!";
    }
    else if (score >= 60) {
        appreciation.innerText = "👍 Good Try! Practice once more!";
    }
    else {
        appreciation.innerText = "💪 Keep Practicing! Try again!";
    }
}
    function compareVoice(referenceAudio, userAudio) {

    function getFeatures(audioBuffer) {

        const data = audioBuffer.getChannelData(0);

        let sum = 0;
        let zeroCrossings = 0;

        let low = 0;
        let mid = 0;
        let high = 0;

        for (let i = 0; i < data.length; i++) {

            const value = data[i];

            sum += value * value;

            if (i > 0) {
                if (
                    (data[i - 1] >= 0 && value < 0) ||
                    (data[i - 1] < 0 && value >= 0)
                ) {
                    zeroCrossings++;
                }
            }

            const frequencyPart =
                Math.abs(value);

            if (i % 3 === 0) {
                low += frequencyPart;
            }
            else if (i % 3 === 1) {
                mid += frequencyPart;
            }
            else {
                high += frequencyPart;
            }
        }

        const rms =
            Math.sqrt(sum / data.length);

        const zcr =
            zeroCrossings / data.length;

        const total =
            low + mid + high || 1;

        return {
            rms: rms,
            zcr: zcr,
            low: low / total,
            mid: mid / total,
            high: high / total
        };
    }


    const reference =
        getFeatures(referenceAudio);

    const user =
        getFeatures(userAudio);


    function similarity(a, b) {

        const difference =
            Math.abs(a - b);

        const maximum =
            Math.max(Math.abs(a), Math.abs(b), 0.000001);

        return Math.max(
            0,
            1 - (difference / maximum)
        );
    }


    const rmsScore =
        similarity(
            reference.rms,
            user.rms
        );

    const zcrScore =
        similarity(
            reference.zcr,
            user.zcr
        );

    const lowScore =
        similarity(
            reference.low,
            user.low
        );

    const midScore =
        similarity(
            reference.mid,
            user.mid
        );

    const highScore =
        similarity(
            reference.high,
            user.high
        );


    const finalScore =
        (
            rmsScore * 0.15 +
            zcrScore * 0.20 +
            lowScore * 0.20 +
            midScore * 0.25 +
            highScore * 0.20
        ) * 100;


    return Math.round(
        Math.max(
            0,
            Math.min(100, finalScore)
        )
    );
}
    
async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };
mediaRecorder.onstop = async function() {

    const audioBlob = new Blob(audioChunks, {
        type: "audio/webm"
    });

    // Show user's recording
    const audioURL = URL.createObjectURL(audioBlob);

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = audioURL;

    document.getElementById("myRecording").innerHTML = "";
    document.getElementById("myRecording").appendChild(audio);


    try {

        // 1. Get the reference A sound
        const response =
            await fetch("static/sounds/a_sound.mp3");

        const referenceData =
            await response.arrayBuffer();

        // 2. Get user's recorded voice
        const userData =
            await audioBlob.arrayBuffer();

        // 3. Decode both voices
        const audioContext =
            new AudioContext();

        const referenceAudio =
            await audioContext.decodeAudioData(
                referenceData
            );

        const userAudio =
            await audioContext.decodeAudioData(
                userData
            );


        // 4. Compare both voices
        const score =
            compareVoice(
                referenceAudio,
                userAudio
            );


        // 5. Show score and grade
        showResult(score);

        await audioContext.close();

    }
    catch (error) {

        console.log(
            "Voice comparison error:",
            error
        );

        document.getElementById("result").innerText =
            "Unable to compare voice.";

    }

};
mediaRecorder.start();

console.log("Recording started");

setTimeout(function() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
    }

    stream.getTracks().forEach(function(track) {
        track.stop();
    });

    console.log("Microphone stopped");
}, 5000);
} catch (error) {
    console.log("Microphone error:", error);
}
    
}   
function goToNext() {
    window.location.href = "/letter_b.html";
}

</script>
