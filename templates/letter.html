<!DOCTYPE html>
<html lang="en">
<head>
    <title>Letter A Learning</title>

    <style>
        .card {
            width: 180px;
            height: 180px;
            border: 3px solid #333;
            border-radius: 15px;
            display: inline-block;
            text-align: center;
            margin: 10px;
            padding: 10px;
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .card p {
            font-size: 20px;
            font-weight: bold;
        }

        .letter {
            font-size: 80px;
            font-weight: bold;
            color: black;
            text-align: center;
            margin: 20px;
            display: inline-block;
        }
        button {
    background-color: brown;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 20px;
}

button:hover {
    background-color: brown;
}
body{
    background-color:#FFF8DC;
    text-align:center;
    font-family:Arial, sans-serif;
}
@keyframes bounce {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-10px); }
    100% { transform: translateY(0); }
}

.animate {
    animation: bounce 0.6s;
}

        
    </style>

</head>


<body>

    <div class="letter">
        A  a
    </div>
    <div class="letter">
    A  a
</div>

<button onclick="playIntro()">🔤 This is Letter A</button>
<button onclick="playSound()">🔊 Hear the Sound</button>
<button onclick="startRecording()">🎤 Record My Voice</button>
<div id="myRecording"></div>
<div id="result"></div>
<div id="appreciation"></div>

<audio id="repeatSound">
    <source src="sounds/a_repeat.mp3" type="audio/mpeg">
</audio>
    <audio id="aSound">
        <source src="sounds/a_sound.mp3" type="audio/mp3">
</audio>

<script>

function playIntro() {
    let audio = new Audio("sounds/a_intro.mp3");

    audio.play();
}

function playSound() {
    let audio = document.getElementById("aSound");
    let letter = document.querySelector(".letter");

    audio.currentTime = 0;
    audio.volume = 1.0;
    audio.play();

    letter.classList.remove("animate");
    void letter.offsetWidth;
    letter.classList.add("animate");
}
let recognition;
let mediaRecorder;
let audioChunks = [];
function showResult(score) {

    const result = document.getElementById("result");
    const appreciation = document.getElementById("appreciation");

    result.innerText = "Score: " + score + "%";

    if (score >= 90) {
        appreciation.innerText = "🌟 Excellent! Perfect pronunciation!";
    }
    else if (score >= 80) {
        appreciation.innerText = "👏 Very Good! Keep it up!";
    }
    else if (score >= 60) {
        appreciation.innerText = "👍 Good Try! Practice once more!";
    }
    else {
        appreciation.innerText = "💪 Keep Practicing! Try again!";
    }
}
async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };
mediaRecorder.onstop = async function() {

    const audioBlob = new Blob(audioChunks, {
        type: "audio/webm"
    });

    // Show user's recording
    const audioURL = URL.createObjectURL(audioBlob);

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = audioURL;

    document.getElementById("myRecording").innerHTML = "";
    document.getElementById("myRecording").appendChild(audio);


    try {

        // 1. Get the reference A sound
        const response =
            await fetch("sounds/a_sound.mp3");

        const referenceData =
            await response.arrayBuffer();

        // 2. Get user's recorded voice
        const userData =
            await audioBlob.arrayBuffer();

        // 3. Decode both voices
        const audioContext =
            new AudioContext();

        const referenceAudio =
            await audioContext.decodeAudioData(
                referenceData
            );

        const userAudio =
            await audioContext.decodeAudioData(
                userData
            );


        // 4. Compare both voices
        const score =
            compareVoice(
                referenceAudio,
                userAudio
            );


        // 5. Show score and grade
        showResult(score);

        await audioContext.close();

    }
    catch (error) {

        console.log(
            "Voice comparison error:",
            error
        );

        document.getElementById("result").innerText =
            "Unable to compare voice.";

    }

};
mediaRecorder.start();

console.log("Recording started");

setTimeout(function() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
    }

    stream.getTracks().forEach(function(track) {
        track.stop();
    });

    console.log("Microphone stopped");
}, 5000);
} catch (error) {
    console.log("Microphone error:", error);
}
    
}   
function goToNext() {
    window.location.href = "/letter_b.html";
}

</script>

</button>

    


</body>
</html>
