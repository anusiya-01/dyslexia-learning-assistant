<html>
<head>
    <title>Letter B Learning</title>

@keyframes bounce {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-10px); }
    100% { transform: translateY(0); }
}

.animate {
    animation: bounce 0.6s;
}

/* ---- Star popup for kids: stars fall in from above with a bounce ---- */
.star-popup-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45);
    z-index: 999;
    align-items: center;
    justify-content: center;
}

.star-popup-overlay.show {
    display: flex;
}

.star-popup-box {
    border: 6px solid brown;
    border-radius: 30px;
    padding: 25px 35px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    max-width: 320px;
    transition: background 0.3s;
}

.star-popup-box.great {
    background: linear-gradient(160deg, #FFF3B0, #FFD93D 70%);
    border-color: #E8A800;
}

.star-popup-box.okay {
    background: linear-gradient(160deg, #D4F4DD, #8DE3A6 70%);
    border-color: #3CAA5C;
}

.star-popup-box.retry {
    background: linear-gradient(160deg, #FFE0D6, #FFB199 70%);
    border-color: #E06B4D;
}

.popup-face {
    font-size: 60px;
    line-height: 1;
    margin-bottom: 5px;
}

.falling-star {
    display: inline-block;
    font-size: 46px;
    opacity: 0;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.25));
    transform: translateY(-250px) rotate(-30deg);
    animation: starFall 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes starFall {
    0%   { opacity: 0; transform: translateY(-250px) rotate(-30deg); }
    70%  { opacity: 1; transform: translateY(15px) rotate(10deg); }
    85%  { transform: translateY(-8px) rotate(-5deg); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg); }
}

.popup-close-btn {
    margin-top: 10px;
    background-color: brown;
    color: white;
    border: none;
    border-radius: 50%;
    width: 55px;
    height: 55px;
    font-size: 26px;
    cursor: pointer;
}

/* Sparkly background stars that rain down gently behind the popup box */
.bg-sparkle {
    position: fixed;
    top: -40px;
    font-size: 34px;
    opacity: 1;
    z-index: 998;
    pointer-events: none;
    animation: sparkleRain linear forwards;
}

.bg-sparkle.tier-great {
    color: #880E4F;
    filter: drop-shadow(0 0 6px #C2185B);
}

.bg-sparkle.tier-okay {
    color: #AD1457;
    filter: drop-shadow(0 0 6px #E91E63);
}

.bg-sparkle.tier-retry {
    color: #D81B60;
    filter: drop-shadow(0 0 6px #F06292);
}

@keyframes sparkleRain {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(200deg); opacity: 0.5; }
}
    </style>

</head>


<body>

    <div class="letter">
        B  b
    </div>
    

<button onclick="playIntro()">🔤 This is Letter B</button>
<button onclick="playSound()">🔊 Hear the Sound</button>
<button onclick="startRecording()">🎤 Record My Voice</button>
<div id="myRecording"></div>
<div id="stars" style="font-size: 40px; letter-spacing: 8px;"></div>

<div id="starPopupOverlay" class="star-popup-overlay" onclick="closeStarPopup(event)">
    <div id="popupBox" class="star-popup-box" onclick="event.stopPropagation()">
        <div id="popupFace" class="popup-face"></div>
        <div id="popupStars"></div>
        <button class="popup-close-btn" onclick="closeStarPopup(event)">👍</button>
    </div>
</div>

<audio id="repeatSound">
    <source src="{{ url_for('static', filename='sounds/b_repeat.mp3') }}" type="audio/mpeg">
</audio>
    <audio id="bSound">
        <source src="{{ url_for('static', filename='sounds/b_sound.mp3')}}" type="audio/mp3"></audio>

<script>

function playIntro() {
    let audio = new Audio(
        "{{ url_for('static', filename='sounds/b_intro.mp3') }}"
    );

    audio.play();
}

function playSound() {
    let audio = document.getElementById("bSound");
    let letter = document.querySelector(".letter");

    audio.currentTime = 0;
    audio.play();

    letter.classList.remove("animate");
    void letter.offsetWidth;
    letter.classList.add("animate");
}

let recognition;
let mediaRecorder;
let audioChunks = [];

/* ---------------- VOICE COMPARISON (same fixed logic as Letter A) ----------------
   1. Trims silence from both clips (adaptive threshold, not a fixed number)
   2. Averages a real FFT spectrum over the WHOLE clip (not just the first frame)
   3. Compares spectral SHAPE (cosine similarity, cubed to sharpen differences)
   4. Compares spectral CENTROID (where the sound's energy sits - the strongest
      signal for telling different letter sounds apart) - acts as a gate so a
      wrong sound can't fake a high score just by having okay shape/duration
   5. Compares duration (softened - speakers naturally differ in timing)
------------------------------------------------------------------------------- */

function trimSilence(data, sampleRate) {
    const frameSize = Math.floor(sampleRate * 0.02); // 20ms frames

    let peak = 0;
    for (let i = 0; i < data.length; i++) {
        peak = Math.max(peak, Math.abs(data[i]));
    }
    const threshold = Math.max(peak * 0.15, 0.005);

    let start = 0;
    let end = data.length;

    for (let i = 0; i < data.length; i += frameSize) {
        let sum = 0;
        const endI = Math.min(i + frameSize, data.length);
        for (let j = i; j < endI; j++) sum += data[j] * data[j];
        const rms = Math.sqrt(sum / (endI - i));
        if (rms > threshold) { start = i; break; }
    }

    for (let i = data.length - frameSize; i >= 0; i -= frameSize) {
        let sum = 0;
        const endI = Math.min(i + frameSize, data.length);
        for (let j = i; j < endI; j++) sum += data[j] * data[j];
        const rms = Math.sqrt(sum / (endI - i));
        if (rms > threshold) { end = endI; break; }
    }

    if (end <= start) return data;
    return data.slice(start, end);
}

function nextPow2(n) {
    let p = 1;
    while (p < n) p *= 2;
    return p;
}

function fft(re, im) {
    const n = re.length;

    for (let i = 1, j = 0; i < n; i++) {
        let bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) {
            [re[i], re[j]] = [re[j], re[i]];
            [im[i], im[j]] = [im[j], im[i]];
        }
    }

    for (let len = 2; len <= n; len <<= 1) {
        const ang = -2 * Math.PI / len;
        const wr = Math.cos(ang), wi = Math.sin(ang);
        for (let i = 0; i < n; i += len) {
            let curWr = 1, curWi = 0;
            for (let j = 0; j < len / 2; j++) {
                const ur = re[i + j], ui = im[i + j];
                const vr = re[i + j + len / 2] * curWr - im[i + j + len / 2] * curWi;
                const vi = re[i + j + len / 2] * curWi + im[i + j + len / 2] * curWr;
                re[i + j] = ur + vr;
                im[i + j] = ui + vi;
                re[i + j + len / 2] = ur - vr;
                im[i + j + len / 2] = ui - vi;
                const nWr = curWr * wr - curWi * wi;
                const nWi = curWr * wi + curWi * wr;
                curWr = nWr;
                curWi = nWi;
            }
        }
    }
}

function spectrumOfFrame(frame, sampleRate, numBands, minFreq, maxFreq) {
    const n = frame.length;
    const re = new Float64Array(n);
    const im = new Float64Array(n);

    for (let i = 0; i < n; i++) {
        const w = 0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (n - 1));
        re[i] = frame[i] * w;
    }

    fft(re, im);

    const half = n / 2;
    const magnitude = new Float64Array(half);
    for (let i = 0; i < half; i++) {
        magnitude[i] = Math.sqrt(re[i] * re[i] + im[i] * im[i]);
    }

    const bands = new Array(numBands).fill(0);
    const nyquist = sampleRate / 2;

    for (let b = 0; b < numBands; b++) {
        const f1 = minFreq * Math.pow(maxFreq / minFreq, b / numBands);
        const f2 = minFreq * Math.pow(maxFreq / minFreq, (b + 1) / numBands);
        const bin1 = Math.floor((f1 / nyquist) * half);
        const bin2 = Math.max(bin1 + 1, Math.floor((f2 / nyquist) * half));
        let sum = 0, count = 0;
        for (let k = bin1; k < bin2 && k < half; k++) {
            sum += magnitude[k];
            count++;
        }
        bands[b] = count > 0 ? sum / count : 0;
    }

    return bands;
}

function getAudioFeatures(data, sampleRate, numBands = 16, minFreq = 150, maxFreq = 3500) {
    const frameSize = nextPow2(Math.min(Math.max(data.length, 256), 2048));
    const hop = Math.floor(frameSize / 2);

    const totals = new Array(numBands).fill(0);
    let frameCount = 0;

    for (let start = 0; start + frameSize <= data.length || frameCount === 0; start += hop) {
        const frame = new Float64Array(frameSize);
        for (let i = 0; i < frameSize; i++) {
            const idx = start + i;
            frame[i] = idx < data.length ? data[idx] : 0;
        }

        const bands = spectrumOfFrame(frame, sampleRate, numBands, minFreq, maxFreq);
        for (let b = 0; b < numBands; b++) totals[b] += bands[b];
        frameCount++;

        if (start + frameSize >= data.length) break;
    }

    const avg = totals.map(v => v / frameCount);

    const centers = [];
    for (let b = 0; b < numBands; b++) {
        const f1 = minFreq * Math.pow(maxFreq / minFreq, b / numBands);
        const f2 = minFreq * Math.pow(maxFreq / minFreq, (b + 1) / numBands);
        centers.push(Math.sqrt(f1 * f2));
    }

    let weightedSum = 0, energySum = 0;
    for (let b = 0; b < numBands; b++) {
        weightedSum += avg[b] * centers[b];
        energySum += avg[b];
    }
    const centroid = energySum > 0 ? weightedSum / energySum : minFreq;

    const compressed = avg.map(v => Math.log10(1 + v * 50));
    const total = compressed.reduce((a, b) => a + b, 0) || 1;
    const shapeBands = compressed.map(v => v / total);

    return { shapeBands, centroid };
}

function cosineSimilarity(a, b) {
    let dot = 0, normA = 0, normB = 0;
    for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        normA += a[i] * a[i];
        normB += b[i] * b[i];
    }
    if (normA === 0 || normB === 0) return 0;
    return dot / (Math.sqrt(normA) * Math.sqrt(normB));
}

function rmsOf(data) {
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
    return Math.sqrt(sum / data.length);
}

function compareVoice(referenceAudio, userAudio) {

    const refRaw = referenceAudio.getChannelData(0);
    const userRaw = userAudio.getChannelData(0);

    const refData = trimSilence(refRaw, referenceAudio.sampleRate);
    const userData = trimSilence(userRaw, userAudio.sampleRate);

    if (rmsOf(userData) < 0.004 || userData.length < userAudio.sampleRate * 0.05) {
        return 0;
    }

    const refFeat = getAudioFeatures(refData, referenceAudio.sampleRate);
    const userFeat = getAudioFeatures(userData, userAudio.sampleRate);

    const rawShapeScore = Math.max(0, cosineSimilarity(refFeat.shapeBands, userFeat.shapeBands));
    const shapeScore = Math.pow(rawShapeScore, 3);

    const centroidRatio = Math.min(refFeat.centroid, userFeat.centroid) /
                           Math.max(refFeat.centroid, userFeat.centroid, 1);

    const refDuration = refData.length / referenceAudio.sampleRate;
    const userDuration = userData.length / userAudio.sampleRate;
    const rawRatio = Math.min(refDuration, userDuration) /
                      Math.max(refDuration, userDuration, 0.01);
    const durationScore = Math.sqrt(rawRatio);

    const baseScore = shapeScore * 0.75 + durationScore * 0.25;

    const CENTROID_CUTOFF = 0.85;
    const centroidPenalty = centroidRatio >= CENTROID_CUTOFF
        ? 1
        : Math.pow(centroidRatio / CENTROID_CUTOFF, 4);

    const finalScore = baseScore * centroidPenalty * 100;

    return Math.round(Math.max(0, Math.min(100, finalScore)));
}

/* ---------------- STARS + POP-UP (kid-friendly, no text to read) ---------------- */

function getStars(score) {
    if (score >= 85) return 3;   // accurate / correct sound
    if (score >= 60) return 2;   // close, somewhat matching
    return 0;                    // wrong sound - no partial credit
}

function showResult(score) {
    const starsDiv = document.getElementById("stars");
    const totalStars = getStars(score);

    starsDiv.innerText = "⭐".repeat(totalStars) + "☆".repeat(3 - totalStars);

    showStarPopup(totalStars);
}

function showStarPopup(totalStars) {
    const overlay = document.getElementById("starPopupOverlay");
    const popupBox = document.getElementById("popupBox");
    const popupStars = document.getElementById("popupStars");
    const popupFace = document.getElementById("popupFace");

    popupBox.classList.remove("great", "okay", "retry");

    let face;
    if (totalStars === 3) {
        face = "😃";
        popupBox.classList.add("great");
    }
    else if (totalStars === 2) {
        face = "🙂";
        popupBox.classList.add("okay");
    }
    else {
        face = "🤗";
        popupBox.classList.add("retry");
    }
    popupFace.textContent = face;

    popupStars.innerHTML = "";
    for (let i = 0; i < 3; i++) {
        const span = document.createElement("span");
        span.className = "falling-star";
        span.style.animationDelay = (i * 0.25) + "s";
        span.textContent = i < totalStars ? "⭐" : "☆";
        popupStars.appendChild(span);
    }

    overlay.classList.add("show");
    spawnSparkleRain(totalStars);
}

function spawnSparkleRain(totalStars) {
    const overlay = document.getElementById("starPopupOverlay");
    const sparkles = ["★", "✦", "✧", "✩"];
    const tierClass = totalStars === 3 ? "tier-great" : totalStars === 2 ? "tier-okay" : "tier-retry";
    const count = 14;

    for (let i = 0; i < count; i++) {
        const s = document.createElement("span");
        s.className = "bg-sparkle " + tierClass;
        s.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
        s.style.left = Math.random() * 100 + "vw";
        s.style.animationDuration = (2 + Math.random() * 1.5) + "s";
        s.style.animationDelay = (Math.random() * 0.8) + "s";
        overlay.appendChild(s);

        setTimeout(() => s.remove(), 4000);
    }
}

function closeStarPopup(event) {
    document.getElementById("starPopupOverlay").classList.remove("show");
}

/* ---------------- END VOICE COMPARISON + STARS SECTION ---------------- */

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async function() {
            const audioBlob = new Blob(audioChunks, {
                type: "audio/webm"
            });

            const audioURL = URL.createObjectURL(audioBlob);

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = audioURL;

            document.getElementById("myRecording").innerHTML = "";
            document.getElementById("myRecording").appendChild(audio);

            try {
                // Use the already-resolved URL of the reference <source> tag,
                // so this works whether it comes from url_for() or a plain path.
                const referenceUrl = document.querySelector("#bSound source").src;

                const response = await fetch(referenceUrl);
                const referenceData = await response.arrayBuffer();

                const userData = await audioBlob.arrayBuffer();

                const audioContext = new AudioContext();

                const referenceAudio = await audioContext.decodeAudioData(referenceData);
                const userAudio = await audioContext.decodeAudioData(userData);

                const score = compareVoice(referenceAudio, userAudio);

                showResult(score);

                await audioContext.close();

            }
            catch (error) {
                console.log("Voice comparison error:", error);
            }
        };

        mediaRecorder.start();

        console.log("Recording started");

        setTimeout(function() {

            // First stop recording
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }

            // IMPORTANT: stop microphone
            stream.getTracks().forEach(function(track) {
                track.stop();
            });

            console.log("Microphone stopped");

        }, 5000);

    } catch (error) {
        console.log("Microphone error:", error);
    }
}
function goToPrevious() {
    window.location.href = "/letter_a";
}


function goToNext() {
    window.location.href = "/letter_c";
}

</script>
