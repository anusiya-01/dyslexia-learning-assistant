<!DOCTYPE html>
<html>
<head>
    <title>Letter J Learning</title>

    <style>
        .card {
            width: 180px;
            height: 180px;
            border: 3px solid #333;
            border-radius: 15px;
            display: inline-block;
            text-align: center;
            margin: 10px;
            padding: 10px;
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .card p {
            font-size: 20px;
            font-weight: bold;
        }

        .letter {
            font-size: 80px;
            font-weight: bold;
            color: black;
            text-align: center;
            margin: 20px;
            display: inline-block;
        }
        button {
    background-color: brown;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 20px;
}

button:hover {
    background-color: brown;
}
body{
    background-color:#FFF8DC;
    text-align:center;
    font-family:Arial, sans-serif;
}
@keyframes bounce {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-10px); }
    100% { transform: translateY(0); }
}

.animate {
    animation: bounce 0.6s;
}

/* --- voice comparison result styles --- */
#voiceResult {
    margin-top: 10px;
    font-size: 22px;
    font-weight: bold;
    min-height: 40px;
}

.stars {
    font-size: 40px;
    display: inline-block;
}

.star {
    display: inline-block;
    opacity: 0;
    transform: scale(0);
    animation: starPop 0.5s ease forwards;
}

.star:nth-child(1) { animation-delay: 0s; }
.star:nth-child(2) { animation-delay: 0.15s; }
.star:nth-child(3) { animation-delay: 0.3s; }

@keyframes starPop {
    0%   { opacity: 0; transform: scale(0) rotate(-45deg); }
    60%  { opacity: 1; transform: scale(1.3) rotate(10deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.try-again {
    color: #b33;
}

        
    </style>

</head>


<body>

    <div class="letter">
        J  j
    </div>
    

<button onclick="playIntro()">🔤 This is Letter J</button>
<button onclick="playSound()">🔊 Hear the Sound</button>
<button onclick="startRecording()">🎤 Record My Voice</button>
<div id="myRecording"></div>
<div id="voiceResult"></div>

<audio id="repeatSound">
    <source src="{{ url_for('static', filename='sounds/j_repeat.mp3') }}" type="audio/mpeg">
</audio>
    <audio id="jSound">
        <source src="{{ url_for('static', filename='sounds/j_sound.mp3')}}" type="audio/mpeg"></audio>

<script>

// Words/sounds that count as a correct attempt for Letter J.
// Add more variations here if kids say the sound differently.
const correctAnswers = ["j", "jay", "jah", "jeep", "juice"];

function playIntro() {
    let audio = new Audio(
        "{{ url_for('static', filename='sounds/j_intro.mp3') }}"
    );

    audio.play();
}

function playSound() {
    let audio = document.getElementById("jSound");
    let letter = document.querySelector(".letter");

    audio.currentTime = 0;
    audio.play();

    letter.classList.remove("animate");
    void letter.offsetWidth;
    letter.classList.add("animate");
}
let recognition;
let mediaRecorder;
let audioChunks = [];
let recognizedText = "";       // what the speech recognizer heard
let recognitionEnded = false;
let recordingEnded = false;

async function startRecording() {
    try {
        // reset state for this attempt
        recognizedText = "";
        recognitionEnded = false;
        recordingEnded = false;
        document.getElementById("voiceResult").innerHTML = "";

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = function() {
            const audioBlob = new Blob(audioChunks, {
                type: "audio/webm"
            });

            const audioURL = URL.createObjectURL(audioBlob);

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = audioURL;

            document.getElementById("myRecording").innerHTML = "";
            document.getElementById("myRecording").appendChild(audio);

            recordingEnded = true;
            checkIfBothDone();
        };

        mediaRecorder.start();
        startSpeechRecognition();

        console.log("Recording started");

        setTimeout(function() {

            // First stop recording
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }

            // IMPORTANT: stop microphone
            stream.getTracks().forEach(function(track) {
                track.stop();
            });

            if (recognition) {
                recognition.stop();
            }

            console.log("Microphone stopped");

        }, 5000);

    } catch (error) {
        console.log("Microphone error:", error);
        document.getElementById("voiceResult").innerHTML =
            "<span class='try-again'>Microphone not available.</span>";
    }
}

// Uses the browser's Web Speech API to turn what the child said into text,
// so we can compare it against the correct answers for this letter.
function startSpeechRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        console.log("Speech recognition not supported in this browser");
        recognitionEnded = true;
        checkIfBothDone();
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;

    recognition.onresult = function(event) {
        // collect every alternative heard, in case the top guess is off
        let heard = [];
        for (let i = 0; i < event.results[0].length; i++) {
            heard.push(event.results[0][i].transcript);
        }
        recognizedText = heard.join(" | ");
        console.log("Heard:", recognizedText);
    };

    recognition.onerror = function(event) {
        console.log("Speech recognition error:", event.error);
    };

    recognition.onend = function() {
        recognitionEnded = true;
        checkIfBothDone();
    };

    recognition.start();
}

// Runs the comparison once both the recording and the recognizer have
// finished, and shows stars (or a "try again") based on the result.
function checkIfBothDone() {
    if (!recognitionEnded || !recordingEnded) {
        return;
    }

    const said = recognizedText.toLowerCase();
    const isCorrect = correctAnswers.some(function(answer) {
        return said.includes(answer);
    });

    showVoiceResult(isCorrect);
}

function showVoiceResult(isCorrect) {
    const resultDiv = document.getElementById("voiceResult");

    if (isCorrect) {
        resultDiv.innerHTML =
            "<div class='stars'>" +
            "<span class='star'>⭐</span>" +
            "<span class='star'>⭐</span>" +
            "<span class='star'>⭐</span>" +
            "</div>" +
            "<div>Great job! 🎉</div>";
    } else {
        resultDiv.innerHTML =
            "<span class='try-again'>Try again! Say the /j/ sound. 🔁</span>";
    }
}

function goToPrevious() {
    window.location.href = "/letter_i";
}


function goToNext() {
    window.location.href = "/letter_k";
}

</script>

    <p>Sound : / jah /</p>

    <h3>Pictures</h3>

    <div class="card">
    <img src="{{ url_for('static', filename='images/jeep.jpg') }}" >
    <p>Jeep</p>
    </div>

    <div class="card">
    <img src="{{ url_for('static', filename='images/juice.jpg') }}" >   
    <p>Juice</p>
    </div>    
    <br><br>
<button onclick="goToPrevious()">
    ← Previous
</button>


<button onclick="goToNext()">
    Next ➜
</button>

    


</body>
</html>
