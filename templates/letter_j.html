<!DOCTYPE html>
<html>
<head>
    <title>Letter J Learning</title>

    <style>
        .card {
            width: 180px;
            height: 180px;
            border: 3px solid #333;
            border-radius: 15px;
            display: inline-block;
            text-align: center;
            margin: 10px;
            padding: 10px;
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .card p {
            font-size: 20px;
            font-weight: bold;
        }

        .letter {
            font-size: 80px;
            font-weight: bold;
            color: black;
            text-align: center;
            margin: 20px;
            display: inline-block;
        }
        button {
            background-color: brown;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px;
        }

        button:hover {
            background-color: brown;
        }
        body{
            background-color:#FFF8DC;
            text-align:center;
            font-family:Arial, sans-serif;
        }
        @keyframes bounce {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .animate {
            animation: bounce 0.6s;
        }

        /* Star Rating Animation Styles */
        #starContainer {
            font-size: 50px;
            margin: 15px 0;
            height: 60px;
        }
        .star-pop {
            display: inline-block;
            animation: popIn 0.5s ease-out forwards;
            margin: 0 5px;
        }
        @keyframes popIn {
            0% { transform: scale(0) translateY(-40px); opacity: 0; }
            70% { transform: scale(1.3) translateY(8px); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    </style>

</head>

<body>

    <div class="letter">
        J  j
    </div>
    
    <br>

    <button onclick="playIntro()">🔤 This is Letter J</button>
    <button onclick="playSound()">🔊 Hear the Sound</button>
    <button id="recBtn" onclick="startRecording()">🎤 Record My Voice</button>

    <!-- Star Container -->
    <div id="starContainer"></div>

    <div id="myRecording"></div>

    <audio id="repeatSound">
        <source src="{{ url_for('static', filename='sounds/j_repeat.mp3') }}" type="audio/mpeg">
    </audio>
    <audio id="jSound">
        <source src="{{ url_for('static', filename='sounds/j_sound.mp3')}}" type="audio/mpeg">
    </audio>

<script>

function playIntro() {
    let audio = new Audio(
        "{{ url_for('static', filename='sounds/j_intro.mp3') }}"
    );

    audio.play();
}

function playSound() {
    let audio = document.getElementById("jSound");
    let letter = document.querySelector(".letter");

    audio.currentTime = 0;
    audio.play();

    letter.classList.remove("animate");
    void letter.offsetWidth;
    letter.classList.add("animate");
}

let mediaRecorder;
let audioChunks = [];
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async function() {
            // Recorded Audio Blob
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const audioURL = URL.createObjectURL(audioBlob);

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = audioURL;

            document.getElementById("myRecording").innerHTML = "";
            document.getElementById("myRecording").appendChild(audio);

            // Compare Audio & Show Stars
            await compareAndScore(audioBlob);
        };

        mediaRecorder.start();
        console.log("Recording started");

        // UI Feedback during recording
        const recBtn = document.getElementById("recBtn");
        recBtn.innerText = "🛑 Recording...";

        setTimeout(function() {

            // First stop recording
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }

            // IMPORTANT: stop microphone
            stream.getTracks().forEach(function(track) {
                track.stop();
            });

            recBtn.innerText = "🎤 Record My Voice";
            console.log("Microphone stopped");

        }, 3000); // 3 வினாடிகள் பதிவுக்குப் பின் தானாக ஒப்பிடும்

    } catch (error) {
        console.log("Microphone error:", error);
    }
}

// Audio Comparison Process
async function compareAndScore(userBlob) {
    try {
        // Decode Recorded Audio
        const userArrayBuffer = await userBlob.arrayBuffer();
        const userAudioBuffer = await audioCtx.decodeAudioData(userArrayBuffer);

        // Fetch and Decode Original Sound (jSound)
        const jSoundElement = document.getElementById("jSound");
        const response = await fetch(jSoundElement.querySelector("source").src);
        const originalArrayBuffer = await response.arrayBuffer();
        const originalAudioBuffer = await audioCtx.decodeAudioData(originalArrayBuffer);

        // Algorithm Comparison
        const score = calculateAudioSimilarity(originalAudioBuffer, userAudioBuffer);

        // Show Stars based on Similarity
        displayStars(score);
    } catch (err) {
        console.log("Comparison error:", err);
        displayStars(40); // Fallback evaluation
    }
}

// Audio Waves Pattern Matching Algorithm
function calculateAudioSimilarity(buf1, buf2) {
    const data1 = buf1.getChannelData(0);
    const data2 = buf2.getChannelData(0);

    const samples = 100;
    const step1 = Math.floor(data1.length / samples);
    const step2 = Math.floor(data2.length / samples);

    let totalDiff = 0;

    for (let i = 0; i < samples; i++) {
        let val1 = Math.abs(data1[i * step1] || 0);
        let val2 = Math.abs(data2[i * step2] || 0);
        totalDiff += Math.abs(val1 - val2);
    }

    let matchPercentage = Math.max(0, 100 - (totalDiff * 100 / samples));
    return matchPercentage;
}

// Display Stars Animation
function displayStars(score) {
    const container = document.getElementById("starContainer");
    container.innerHTML = "";

    let starCount = 1;
    if (score > 55) {
        starCount = 3; // Excellent
    } else if (score > 35) {
        starCount = 2; // Good
    } else {
        starCount = 1; // Try Again
    }

    // Dynamic Pop-up Animation
    for (let i = 0; i < starCount; i++) {
        setTimeout(() => {
            const star = document.createElement("span");
            star.innerText = "⭐";
            star.className = "star-pop";
            container.appendChild(star);
        }, i * 200);
    }
}

function goToPrevious() {
    window.location.href = "/letter_i";
}

function goToNext() {
    window.location.href = "/letter_k";
}

</script>

    <p>Sound : / jah /</p>

        <img src="{{ url_for('static', filename='images/jeep.jpg') }}" >
        <p>Jeep</p>
    </div>

    <div class="card">
        <img src="{{ url_for('static', filename='images/juice.jpg') }}" >   
        <p>Juice</p>
    </div>    
    <br><br>

<button onclick="goToPrevious()">
    ← Previous
</button>

<button onclick="goToNext()">
    Next ➜
</button>

</body>
</html>
