<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter J Learning</title>

    <style>
        body {
            background-color: #FFF8DC;
            text-align: center;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 20px;
        }

        .letter {
            font-size: 80px;
            font-weight: bold;
            color: #2C3E50;
            text-align: center;
            margin: 15px;
            display: inline-block;
        }

        .card {
            width: 170px;
            height: 180px;
            border: 3px solid #333;
            border-radius: 15px;
            display: inline-block;
            text-align: center;
            margin: 10px;
            padding: 10px;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .card p {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            color: #333;
        }

        button {
            background-color: #8B0000;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #5a1818;
            transform: scale(1.05);
        }

        #myRecording {
            margin-top: 15px;
        }

        @keyframes bounce {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-15px); }
            100% { transform: translateY(0); }
        }

        .animate {
            animation: bounce 0.5s ease-in-out;
        }

        /* --- POPUP MODAL FOR STARS --- */
        .star-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .star-modal-card {
            background: #ffffff;
            border-radius: 25px;
            padding: 30px 40px;
            border: 5px solid #FFD700;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            animation: modalBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 340px;
            width: 80%;
        }

        @keyframes modalBounce {
            0% { transform: scale(0.3) translateY(-100px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 26px;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 10px;
        }

        .modal-stars {
            font-size: 60px;
            margin: 10px 0;
            min-height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .star-anim {
            display: inline-block;
            animation: dropStar 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.2));
        }

        @keyframes dropStar {
            0% { transform: translateY(-120px) scale(0) rotate(-180deg); opacity: 0; }
            70% { transform: translateY(10px) scale(1.3) rotate(20deg); opacity: 1; }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }

        .modal-msg {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .close-btn {
            background-color: #28a745;
            color: white;
            font-size: 18px;
            padding: 10px 25px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin: 0;
        }

        /* --- FALLING STARS SHOWER --- */
        .falling-star {
            position: fixed;
            top: -50px;
            font-size: 30px;
            z-index: 999;
            pointer-events: none;
            animation: fallDown linear forwards;
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>

<body>

    <div class="letter">
        J  j
    </div>
    
    <br>

    <button onclick="playIntro()">🔤 This is Letter J</button>
    <button onclick="playSound()">🔊 Hear the Sound</button>
    <button id="recBtn" onclick="startRecording()">🎤 Record My Voice</button>

    <div id="myRecording"></div>

    <!-- POPUP MODAL FOR STAR RATING -->
    <div id="starModal" class="star-modal-overlay">
        <div class="star-modal-card">
            <div id="modalTitle" class="modal-title">Awesome!</div>
            <div id="modalStars" class="modal-stars"></div>
            <div id="modalMsg" class="modal-msg">Great job!</div>
            <button class="close-btn" onclick="closeModal()">Try Again 🔄</button>
        </div>
    </div>

    <!-- Audio Elements with Cache Fix -->
    <audio id="jSound" preload="auto">
        <source src="{{ url_for('static', filename='sounds/j_sound.mp3') }}" type="audio/mpeg">
    </audio>

<script>

function playIntro() {
    let audio = new Audio("{{ url_for('static', filename='sounds/j_intro.mp3') }}");
    audio.play().catch(e => console.log("Intro sound error:", e));
}

// 🔊 FIX FOR AUDIO STOPPING MIDWAY
function playSound() {
    let audio = document.getElementById("jSound");
    let letter = document.querySelector(".letter");

    if (audio) {
        audio.pause();
        audio.currentTime = 0; // Reset audio to start
        audio.play().catch(e => console.log("Sound play error:", e));

        // Animate Letter
        letter.classList.remove("animate");
        void letter.offsetWidth; // Trigger reflow
        letter.classList.add("animate");
    }
}

let mediaRecorder;
let audioChunks = [];
let audioCtx;

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async function() {
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const audioURL = URL.createObjectURL(audioBlob);

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = audioURL;

            document.getElementById("myRecording").innerHTML = "";
            document.getElementById("myRecording").appendChild(audio);

            // Compare recorded voice
            await compareAndScore(audioBlob);
        };

        mediaRecorder.start();

        const recBtn = document.getElementById("recBtn");
        recBtn.innerText = "🛑 Listening...";

        setTimeout(function() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }

            stream.getTracks().forEach(track => track.stop());
            recBtn.innerText = "🎤 Record My Voice";

        }, 3000); // 3 seconds recording time

    } catch (error) {
        alert("Please allow microphone access in your browser!");
    }
}

// 🎯 ACCURATE PHONICS & STAR EVALUATION
async function compareAndScore(userBlob) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        // 1. Decode User Recorded Audio
        const userArrayBuffer = await userBlob.arrayBuffer();
        const userAudioBuffer = await audioCtx.decodeAudioData(userArrayBuffer);

        // 2. Fetch Original Reference Sound
        const jSoundElement = document.getElementById("jSound");
        const sourceUrl = jSoundElement.querySelector("source").src;
        const response = await fetch(sourceUrl);
        const originalArrayBuffer = await response.arrayBuffer();
        const originalAudioBuffer = await audioCtx.decodeAudioData(originalArrayBuffer);

        // 3. Compute Phonics Score
        const score = calculateStrictPhonicsScore(originalAudioBuffer, userAudioBuffer);
        
        displayStarPopup(score);

    } catch (err) {
        console.error("Comparison error:", err);
        displayStarPopup(20); // Fallback for error/silence
    }
}

function calculateStrictPhonicsScore(origBuf, userBuf) {
    const origData = origBuf.getChannelData(0);
    const userData = userBuf.getChannelData(0);

    // 1. Trim Silence & Background Noise
    const origClean = trimSilence(origData);
    const userClean = trimSilence(userData);

    // Check if recorded audio is empty/too quiet
    if (userClean.length < (userBuf.sampleRate * 0.15)) {
        console.log("Audio too silent or short!");
        return 10; // Forced 1 Star
    }

    // 2. Compare Frequency Energies
    const bands = 16;
    const origSpec = getSpeechBands(origClean, bands);
    const userSpec = getSpeechBands(userClean, bands);

    let spectralDiff = 0;
    for (let i = 0; i < bands; i++) {
        spectralDiff += Math.abs(origSpec[i] - userSpec[i]);
    }
    spectralDiff = spectralDiff / bands;

    // 3. Compare Zero Crossing Rates (Speech Sharpness)
    const origZCR = getZCR(origClean);
    const userZCR = getZCR(userClean);
    let zcrDiff = Math.abs(origZCR - userZCR);

    // 4. Dynamic Percentage Scoring
    let similarity = 100 - (spectralDiff * 140) - (zcrDiff * 200);
    let finalScore = Math.max(5, Math.min(100, Math.round(similarity)));

    console.log("Calculated Speech Score:", finalScore);
    return finalScore;
}

function getSpeechBands(buffer, bands) {
    let spectrum = new Float32Array(bands);
    let chunkSize = Math.floor(buffer.length / bands);

    for (let i = 0; i < bands; i++) {
        let sum = 0;
        let start = i * chunkSize;
        let end = Math.min(buffer.length, start + chunkSize);

        for (let j = start; j < end; j++) {
            sum += Math.abs(buffer[j]);
        }
        spectrum[i] = sum / (end - start + 1);
    }

    // Normalization
    let maxEnergy = Math.max(...spectrum);
    if (maxEnergy > 0) {
        for (let i = 0; i < bands; i++) spectrum[i] /= maxEnergy;
    }

    return spectrum;
}

function trimSilence(buffer) {
    let maxVal = 0;
    for (let i = 0; i < buffer.length; i++) {
        if (Math.abs(buffer[i]) > maxVal) maxVal = Math.abs(buffer[i]);
    }
    
    let threshold = maxVal * 0.20; // Ignore under 20% volume
    let start = 0;
    while (start < buffer.length && Math.abs(buffer[start]) < threshold) start++;
    
    let end = buffer.length - 1;
    while (end > start && Math.abs(buffer[end]) < threshold) end--;
    
    return buffer.subarray(start, end + 1);
}

function getZCR(buffer) {
    let count = 0;
    for (let i = 1; i < buffer.length; i++) {
        if ((buffer[i] >= 0 && buffer[i-1] < 0) || (buffer[i] < 0 && buffer[i-1] >= 0)) {
            count++;
        }
    }
    return count / buffer.length;
}

// 🌟 STAR POPUP DISPLAY SYSTEM
function displayStarPopup(score) {
    const modal = document.getElementById("starModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalStars = document.getElementById("modalStars");
    const modalMsg = document.getElementById("modalMsg");

    modalStars.innerHTML = "";

    let starCount = 1;
    let titleText = "Try Again! 😃";
    let messageText = "Say / jah / clearly!";

    // ACCURATE STAR CUT-OFFS
    if (score >= 68) {
        starCount = 3; // Excellent
        titleText = "Superstar! 🌟";
        messageText = "Perfect Pronunciation!";
    } else if (score >= 38) {
        starCount = 2; // Good Try
        titleText = "Good Job! 👍";
        messageText = "Almost correct, try once more!";
    } else {
        starCount = 1; // Wrong / Low Audio
        titleText = "Try Again! 😃";
        messageText = "Incorrect sound! Listen and repeat!";
    }

    modalTitle.innerText = titleText;
    modalMsg.innerText = messageText;
    modal.style.display = "flex";

    for (let i = 0; i < starCount; i++) {
        setTimeout(() => {
            const starSpan = document.createElement("span");
            starSpan.innerText = "⭐";
            starSpan.className = "star-anim";
            modalStars.appendChild(starSpan);
        }, i * 200);
    }

    if (starCount >= 2) {
        createFallingStarsShower(starCount * 8);
    }
}

function createFallingStarsShower(count) {
    const starIcons = ["⭐", "✨", "🌟"];
    
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const star = document.createElement("div");
            star.className = "falling-star";
            star.innerText = starIcons[Math.floor(Math.random() * starIcons.length)];
            star.style.left = Math.random() * 95 + "vw";
            star.style.animationDuration = (Math.random() * 2 + 1.5) + "s";
            star.style.fontSize = (Math.random() * 15 + 25) + "px";
            
            document.body.appendChild(star);

            setTimeout(() => star.remove(), 3000);
        }, i * 100);
    }
}

function closeModal() {
    document.getElementById("starModal").style.display = "none";
}

function goToPrevious() {
    window.location.href = "/letter_i";
}

function goToNext() {
    window.location.href = "/letter_k";
}

</script>

    <p>Sound : / jah /</p>

        <!-- onerror ஃபைல் இல்லாவிட்டாலும் படத்தைக் காட்டும் -->
        <img src="{{ url_for('static', filename='images/jeep.jpg') }}" 
             onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3202/3202027.png';" 
             alt="Jeep">
        <p>Jeep</p>
    </div>

    <div class="card">
        <img src="{{ url_for('static', filename='images/juice.jpg') }}" 
             onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2442/2442019.png';" 
             alt="Juice">   
        <p>Juice</p>
    </div>    
    <br><br>

    <button onclick="goToPrevious()">← Previous</button>
    <button onclick="goToNext()">Next ➜</button>

</body>
