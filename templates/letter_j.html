<!DOCTYPE html>
<html>
<head>
    <title>Letter J Learning</title>

    <style>
        .card {
            width: 180px;
            height: 180px;
            border: 3px solid #333;
            border-radius: 15px;
            display: inline-block;
            text-align: center;
            margin: 10px;
            padding: 10px;
            background: white;
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .card p {
            font-size: 20px;
            font-weight: bold;
        }

        .letter {
            font-size: 80px;
            font-weight: bold;
            color: black;
            text-align: center;
            margin: 20px;
            display: inline-block;
        }

        button {
            background-color: brown;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px;
            transition: transform 0.2s;
        }

        button:hover {
            background-color: brown;
            transform: scale(1.05);
        }

        body{
            background-color:#FFF8DC;
            text-align:center;
            font-family:Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes bounce {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .animate {
            animation: bounce 0.6s;
        }

        /* --- POPUP MODAL FOR STARS --- */
        .star-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .star-modal-card {
            background: #ffffff;
            border-radius: 25px;
            padding: 30px 40px;
            border: 5px solid #FFD700;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            animation: modalBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 340px;
            width: 80%;
        }

        @keyframes modalBounce {
            0% { transform: scale(0.3) translateY(-100px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 26px;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 10px;
        }

        .modal-stars {
            font-size: 65px;
            margin: 15px 0;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .star-anim {
            display: inline-block;
            animation: dropStar 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.2));
        }

        @keyframes dropStar {
            0% { transform: translateY(-150px) scale(0) rotate(-180deg); opacity: 0; }
            70% { transform: translateY(15px) scale(1.3) rotate(20deg); opacity: 1; }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }

        .modal-msg {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .close-btn {
            background-color: #28a745;
            color: white;
            font-size: 18px;
            padding: 10px 25px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin: 0;
        }

        /* --- FALLING STARS SHOWER --- */
        .falling-star {
            position: fixed;
            top: -50px;
            font-size: 30px;
            z-index: 999;
            pointer-events: none;
            animation: fallDown linear forwards;
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
    </style>

</head>

<body>

    <div class="letter">
        J  j
    </div>
    
    <br>

    <button onclick="playIntro()">🔤 This is Letter J</button>
    <button onclick="playSound()">🔊 Hear the Sound</button>
    <button id="recBtn" onclick="startRecording()">🎤 Record My Voice</button>

    <div id="myRecording"></div>

    <!-- POPUP MODAL FOR STAR RATING -->
    <div id="starModal" class="star-modal-overlay">
        <div class="star-modal-card">
            <div id="modalTitle" class="modal-title">Awesome!</div>
            <div id="modalStars" class="modal-stars"></div>
            <div id="modalMsg" class="modal-msg">Great job!</div>
            <button class="close-btn" onclick="closeModal()">Try Again 🔄</button>
        </div>
    </div>

    <audio id="repeatSound">
        <source src="{{ url_for('static', filename='sounds/j_repeat.mp3') }}" type="audio/mpeg">
    </audio>
    <audio id="jSound">
        <source src="{{ url_for('static', filename='sounds/j_sound.mp3')}}" type="audio/mpeg">
    </audio>

<script>

function playIntro() {
    let audio = new Audio(
        "{{ url_for('static', filename='sounds/j_intro.mp3') }}"
    );

    audio.play();
}

function playSound() {
    let audio = document.getElementById("jSound");
    let letter = document.querySelector(".letter");

    audio.currentTime = 0;
    audio.play();

    letter.classList.remove("animate");
    void letter.offsetWidth;
    letter.classList.add("animate");
}

let mediaRecorder;
let audioChunks = [];
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async function() {
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const audioURL = URL.createObjectURL(audioBlob);

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = audioURL;

            document.getElementById("myRecording").innerHTML = "";
            document.getElementById("myRecording").appendChild(audio);

            // Compare recorded audio with original sound
            await compareAndScore(audioBlob);
        };

        mediaRecorder.start();
        console.log("Recording started");

        const recBtn = document.getElementById("recBtn");
        recBtn.innerText = "🛑 Listening...";

        setTimeout(function() {

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }

            stream.getTracks().forEach(function(track) {
                track.stop();
            });

            recBtn.innerText = "🎤 Record My Voice";
            console.log("Microphone stopped");

        }, 3000); // 3 seconds recording time

    } catch (error) {
        console.log("Microphone error:", error);
        alert("Please allow microphone access!");
    }
}

// STRICT & ACCURATE VOICE COMPARISON ALGORITHM
async function compareAndScore(userBlob) {
    try {
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        // 1. Decode User Recording
        const userArrayBuffer = await userBlob.arrayBuffer();
        const userAudioBuffer = await audioCtx.decodeAudioData(userArrayBuffer);

        // 2. Fetch & Decode Reference Phonics Audio (jSound)
        const jSoundElement = document.getElementById("jSound");
        const sourceUrl = jSoundElement.querySelector("source").src;
        const response = await fetch(sourceUrl);
        const originalArrayBuffer = await response.arrayBuffer();
        const originalAudioBuffer = await audioCtx.decodeAudioData(originalArrayBuffer);

        // 3. Compute Accuracy Score
        const score = calculateStrictPhonicsScore(originalAudioBuffer, userAudioBuffer);
        
        displayStarPopup(score);

    } catch (err) {
        console.error("Comparison error:", err);
        displayStarPopup(0); // If audio processing fails, give 1 Star
    }
}

function calculateStrictPhonicsScore(origBuf, userBuf) {
    const origData = origBuf.getChannelData(0);
    const userData = userBuf.getChannelData(0);

    // --- STEP 1: SILENCE / NOISE CHECK ---
    const origClean = trimSilence(origData);
    const userClean = trimSilence(userData);

    // If user didn't speak or spoke too quietly
    if (userClean.length < (userBuf.sampleRate * 0.15)) {
        return 0; // 1 Star
    }

    // --- STEP 2: SPECTRAL FEATURE EXTRACTION (16 Frequency Bands) ---
    const numBands = 16;
    const origSpectrum = getFrequencyDistribution(origClean, numBands);
    const userSpectrum = getFrequencyDistribution(userClean, numBands);

    // --- STEP 3: COSINE SIMILARITY OF FREQUENCY SHAPE ---
    let spectralMatch = cosineSimilarity(origSpectrum, userSpectrum); // 0.0 to 1.0

    // --- STEP 4: ZERO CROSSING RATE (Pitch & Sibilance check) ---
    const origZCR = getZCR(origClean);
    const userZCR = getZCR(userClean);
    let zcrDiff = Math.abs(origZCR - userZCR);
    let zcrScore = Math.max(0, 1 - (zcrDiff * 5));

    // --- STEP 5: DURATION RATIO CHECK ---
    const origDur = origClean.length / origBuf.sampleRate;
    const userDur = userClean.length / userBuf.sampleRate;
    const durRatio = Math.min(origDur, userDur) / Math.max(origDur, userDur);

    // --- FINAL WEIGHTED SCORE CALCULATION ---
    let finalRatio = (spectralMatch * 0.70) + (zcrScore * 0.20) + (durRatio * 0.10);
    
    let score = Math.round(finalRatio * 100);
    return score;
}

// Helper: Trim Silence using Peak Amplitude
function trimSilence(buffer) {
    let maxVal = 0;
    for (let i = 0; i < buffer.length; i++) {
        let abs = Math.abs(buffer[i]);
        if (abs > maxVal) maxVal = abs;
    }
    
    let threshold = maxVal * 0.12; // 12% of peak volume
    let start = 0;
    while (start < buffer.length && Math.abs(buffer[start]) < threshold) {
        start++;
    }
    
    let end = buffer.length - 1;
    while (end > start && Math.abs(buffer[end]) < threshold) {
        end--;
    }
    
    return buffer.subarray(start, end + 1);
}

// Helper: Compute Energy across 16 Frequency Bands
function getFrequencyDistribution(buffer, bands) {
    let spectrum = new Float32Array(bands);
    let chunkSize = Math.floor(buffer.length / bands);
    
    for (let i = 0; i < bands; i++) {
        let sum = 0;
        let start = i * chunkSize;
        let end = Math.min(buffer.length, start + chunkSize);
        
        for (let j = start; j < end; j++) {
            sum += buffer[j] * buffer[j];
        }
        spectrum[i] = Math.sqrt(sum / (end - start + 1));
    }
    
    let sumTotal = 0;
    for (let i = 0; i < bands; i++) sumTotal += spectrum[i];
    if (sumTotal > 0) {
        for (let i = 0; i < bands; i++) spectrum[i] /= sumTotal;
    }
    
    return spectrum;
}

// Helper: Zero Crossing Rate
function getZCR(buffer) {
    let count = 0;
    for (let i = 1; i < buffer.length; i++) {
        if ((buffer[i] >= 0 && buffer[i-1] < 0) || (buffer[i] < 0 && buffer[i-1] >= 0)) {
            count++;
        }
    }
    return count / buffer.length;
}

// Helper: Cosine Similarity
function cosineSimilarity(vecA, vecB) {
    let dot = 0, normA = 0, normB = 0;
    for (let i = 0; i < vecA.length; i++) {
        dot += vecA[i] * vecB[i];
        normA += vecA[i] * vecA[i];
        normB += vecB[i] * vecB[i];
    }
    if (normA === 0 || normB === 0) return 0;
    return dot / (Math.sqrt(normA) * Math.sqrt(normB));
}

// Pop-up & Falling Stars Display
function displayStarPopup(score) {
    const modal = document.getElementById("starModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalStars = document.getElementById("modalStars");
    const modalMsg = document.getElementById("modalMsg");

    modalStars.innerHTML = "";

    let starCount = 1;
    let titleText = "Try Again! 😃";
    let messageText = "Say / jah / clearly!";

    // ACCURATE STAR EVALUATION
    if (score >= 80) {
        starCount = 3; // Excellent Match
        titleText = "Superstar! 🌟";
        messageText = "Perfect Pronunciation!";
    } else if (score >= 55) {
        starCount = 2; // Medium Match
        titleText = "Good Job! 👍";
        messageText = "Almost correct, try once more!";
    } else {
        starCount = 1; // Wrong Sound or Silence
        titleText = "Try Again! 😃";
        messageText = "Incorrect sound! Listen and repeat!";
    }

    modalTitle.innerText = titleText;
    modalMsg.innerText = messageText;

    // Display Modal
    modal.style.display = "flex";

    // Add Stars with animated bounce
    for (let i = 0; i < starCount; i++) {
        setTimeout(() => {
            const starSpan = document.createElement("span");
            starSpan.innerText = "⭐";
            starSpan.className = "star-anim";
            modalStars.appendChild(starSpan);
        }, i * 250);
    }

    // Trigger Falling Stars Shower only for 2 or 3 stars
    if (starCount >= 2) {
        createFallingStarsShower(starCount * 10);
    }
}

// Falling Stars Celebration Shower
function createFallingStarsShower(count) {
    const starIcons = ["⭐", "✨", "🌟", "🎉"];
    
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const star = document.createElement("div");
            star.className = "falling-star";
            star.innerText = starIcons[Math.floor(Math.random() * starIcons.length)];
            star.style.left = Math.random() * 95 + "vw";
            star.style.animationDuration = (Math.random() * 2 + 1.5) + "s";
            star.style.fontSize = (Math.random() * 20 + 25) + "px";
            
            document.body.appendChild(star);

            setTimeout(() => {
                star.remove();
            }, 3500);
        }, i * 80);
    }
}

function closeModal() {
    document.getElementById("starModal").style.display = "none";
}

function goToPrevious() {
    window.location.href = "/letter_i";
}

function goToNext() {
    window.location.href = "/letter_k";
}

</script>
