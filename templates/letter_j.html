<!DOCTYPE html>
<html>
<head>
    <title>Letter J Learning</title>

    <style>
        .card {
            width: 180px;
            height: 180px;
            border: 3px solid #333;
            border-radius: 15px;
            display: inline-block;
            text-align: center;
            margin: 10px;
            padding: 10px;
            background: white;
        }

        .card img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .card p {
            font-size: 20px;
            font-weight: bold;
        }

        .letter {
            font-size: 80px;
            font-weight: bold;
            color: black;
            text-align: center;
            margin: 20px;
            display: inline-block;
        }

        button {
            background-color: brown;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 20px;
            transition: transform 0.2s;
        }

        button:hover {
            background-color: brown;
            transform: scale(1.05);
        }

        body{
            background-color:#FFF8DC;
            text-align:center;
            font-family:Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes bounce {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .animate {
            animation: bounce 0.6s;
        }

        /* --- ATTRACTIVE POPUP MODAL FOR STARS --- */
        .star-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .star-modal-card {
            background: #ffffff;
            border-radius: 25px;
            padding: 30px 40px;
            border: 5px solid #FFD700;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            animation: modalBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 320px;
            width: 80%;
        }

        @keyframes modalBounce {
            0% { transform: scale(0.3) translateY(-100px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 26px;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 10px;
        }

        .modal-stars {
            font-size: 65px;
            margin: 15px 0;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .star-anim {
            display: inline-block;
            animation: dropStar 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.2));
        }

        @keyframes dropStar {
            0% { transform: translateY(-150px) scale(0) rotate(-180deg); opacity: 0; }
            70% { transform: translateY(15px) scale(1.3) rotate(20deg); opacity: 1; }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }

        .modal-msg {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .close-btn {
            background-color: #28a745;
            color: white;
            font-size: 18px;
            padding: 10px 25px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin: 0;
        }

        /* --- CELEBRATION FALLING STARS SHOWER EFFECT --- */
        .falling-star {
            position: fixed;
            top: -50px;
            font-size: 30px;
            z-index: 999;
            pointer-events: none;
            animation: fallDown linear forwards;
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
    </style>

</head>

<body>

    <div class="letter">
        J  j
    </div>
    
    <br>

    <button onclick="playIntro()">🔤 This is Letter J</button>
    <button onclick="playSound()">🔊 Hear the Sound</button>
    <button id="recBtn" onclick="startRecording()">🎤 Record My Voice</button>

    <div id="myRecording"></div>

    <!-- POPUP MODAL FOR STAR RATING -->
    <div id="starModal" class="star-modal-overlay">
        <div class="star-modal-card">
            <div id="modalTitle" class="modal-title">Awesome!</div>
            <div id="modalStars" class="modal-stars"></div>
            <div id="modalMsg" class="modal-msg">Great job!</div>
            <button class="close-btn" onclick="closeModal()">Try Again 🔄</button>
        </div>
    </div>

    <audio id="repeatSound">
        <source src="{{ url_for('static', filename='sounds/j_repeat.mp3') }}" type="audio/mpeg">
    </audio>
    <audio id="jSound">
        <source src="{{ url_for('static', filename='sounds/j_sound.mp3')}}" type="audio/mpeg">
    </audio>

<script>

function playIntro() {
    let audio = new Audio(
        "{{ url_for('static', filename='sounds/j_intro.mp3') }}"
    );

    audio.play();
}

function playSound() {
    let audio = document.getElementById("jSound");
    let letter = document.querySelector(".letter");

    audio.currentTime = 0;
    audio.play();

    letter.classList.remove("animate");
    void letter.offsetWidth;
    letter.classList.add("animate");
}

let mediaRecorder;
let audioChunks = [];
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async function() {
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const audioURL = URL.createObjectURL(audioBlob);

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.src = audioURL;

            document.getElementById("myRecording").innerHTML = "";
            document.getElementById("myRecording").appendChild(audio);

            // Compare recorded audio with original sound
            await compareAndScore(audioBlob);
        };

        mediaRecorder.start();
        console.log("Recording started");

        const recBtn = document.getElementById("recBtn");
        recBtn.innerText = "🛑 Listening...";

        setTimeout(function() {

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }

            stream.getTracks().forEach(function(track) {
                track.stop();
            });

            recBtn.innerText = "🎤 Record My Voice";
            console.log("Microphone stopped");

        }, 3000); // 3 seconds recording time

    } catch (error) {
        console.log("Microphone error:", error);
        alert("Please allow microphone access!");
    }
}

// Improved Audio Energy & Frequency Comparison Algorithm
async function compareAndScore(userBlob) {
    try {
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        const userArrayBuffer = await userBlob.arrayBuffer();
        const userAudioBuffer = await audioCtx.decodeAudioData(userArrayBuffer);

        const jSoundElement = document.getElementById("jSound");
        const response = await fetch(jSoundElement.querySelector("source").src);
        const originalArrayBuffer = await response.arrayBuffer();
        const originalAudioBuffer = await audioCtx.decodeAudioData(originalArrayBuffer);

        const score = calculateVoiceScore(originalAudioBuffer, userAudioBuffer);
        
        displayStarPopup(score);
    } catch (err) {
        console.log("Comparison error:", err);
        displayStarPopup(20); // Default to low score if audio fails
    }
}

// Accurate Comparison based on Volume Energy & Peak Pattern
function calculateVoiceScore(origBuf, userBuf) {
    const origData = origBuf.getChannelData(0);
    const userData = userBuf.getChannelData(0);

    // Calculate Average Volume Energy (RMS) for User Recording
    let userSumSquare = 0;
    for (let i = 0; i < userData.length; i++) {
        userSumSquare += userData[i] * userData[i];
    }
    const userRMS = Math.sqrt(userSumSquare / userData.length);

    // If user made almost no sound (Silence / Noise threshold)
    if (userRMS < 0.015) {
        return 10; // Very Low / Silence -> 1 Star
    }

    // Compare Energy Profiles across 50 frames
    const numFrames = 50;
    const origStep = Math.floor(origData.length / numFrames);
    const userStep = Math.floor(userData.length / numFrames);

    let frameDiffs = 0;

    for (let f = 0; f < numFrames; f++) {
        let oSum = 0, uSum = 0;
        for (let j = 0; j < origStep; j++) {
            let oVal = origData[f * origStep + j] || 0;
            oSum += oVal * oVal;
        }
        for (let j = 0; j < userStep; j++) {
            let uVal = userData[f * userStep + j] || 0;
            uSum += uVal * uVal;
        }

        let oRmsFrame = Math.sqrt(oSum / origStep);
        let uRmsFrame = Math.sqrt(uSum / userStep);

        frameDiffs += Math.abs(oRmsFrame - uRmsFrame);
    }

    // Similarity percentage computation
    let rawScore = 100 - (frameDiffs * 150 / numFrames);
    let finalScore = Math.min(100, Math.max(0, rawScore));

    return finalScore;
}

// Beautiful Pop-up & Falling Stars Shower
function displayStarPopup(score) {
    const modal = document.getElementById("starModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalStars = document.getElementById("modalStars");
    const modalMsg = document.getElementById("modalMsg");

    modalStars.innerHTML = "";

    let starCount = 1;
    let titleText = "Try Again! 😃";
    let messageText = "Say / jah / loudly and clearly!";

    if (score >= 60) {
        starCount = 3;
        titleText = "Superstar! 🌟";
        messageText = "Perfect Pronunciation!";
    } else if (score >= 35) {
        starCount = 2;
        titleText = "Good Job! 👍";
        messageText = "You are almost there!";
    } else {
        starCount = 1;
        titleText = "Try Again! 😃";
        messageText = "Listen to the sound and repeat!";
    }

    modalTitle.innerText = titleText;
    modalMsg.innerText = messageText;

    // Show Popup
    modal.style.display = "flex";

    // Add Stars sequentially with bounce drop animation
    for (let i = 0; i < starCount; i++) {
        setTimeout(() => {
            const starSpan = document.createElement("span");
            starSpan.innerText = "⭐";
            starSpan.className = "star-anim";
            modalStars.appendChild(starSpan);
        }, i * 250);
    }

    // Trigger Falling Stars Celebration Shower from top
    createFallingStarsShower(starCount * 10);
}

// Function to generate falling stars effect across screen
function createFallingStarsShower(count) {
    const starIcons = ["⭐", "✨", "🌟", "🎉"];
    
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const star = document.createElement("div");
            star.className = "falling-star";
            star.innerText = starIcons[Math.floor(Math.random() * starIcons.length)];
            star.style.left = Math.random() * 95 + "vw";
            star.style.animationDuration = (Math.random() * 2 + 1.5) + "s";
            star.style.fontSize = (Math.random() * 20 + 25) + "px";
            
            document.body.appendChild(star);

            setTimeout(() => {
                star.remove();
            }, 3500);
        }, i * 80);
    }
}

function closeModal() {
    document.getElementById("starModal").style.display = "none";
}

function goToPrevious() {
    window.location.href = "/letter_i";
}

function goToNext() {
    window.location.href = "/letter_k";
}

</script>

    <p>Sound : / jah /</p>

        <img src="{{ url_for('static', filename='images/jeep.jpg') }}" >
        <p>Jeep</p>
    </div>

    <div class="card">
        <img src="{{ url_for('static', filename='images/juice.jpg') }}" >   
        <p>Juice</p>
    </div>    
    <br><br>

<button onclick="goToPrevious()">
    ← Previous
</button>

<button onclick="goToNext()">
    Next ➜
</button>

</body>
</html>
