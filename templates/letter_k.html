<body>

            type="audio/mpeg">

<script>


/* ==========================================
   K INTRO
   ========================================== */

function playIntro() {

    let audio = new Audio(
        "{{ url_for('static', filename='sounds/k_intro.mp3') }}"
    );

    audio.play();
}


/* ==========================================
   K SOUND
   ========================================== */

function playSound() {

    let audio =
        document.getElementById("kSound");

    let letter =
        document.querySelector(".letter");

    audio.currentTime = 0;

    audio.play();

    letter.classList.remove("animate");

    void letter.offsetWidth;

    letter.classList.add("animate");
}


/* =========================================================
   VOICE COMPARISON ALGORITHM
   ========================================================= */


/* Remove silence from beginning and end */

function trimSilence(buffer) {

    const data =
        buffer.getChannelData(0);

    const threshold = 0.008;

    let start = 0;

    let end =
        data.length - 1;


    while (
        start < data.length &&
        Math.abs(data[start]) < threshold
    ) {
        start++;
    }


    while (
        end > start &&
        Math.abs(data[end]) < threshold
    ) {
        end--;
    }


    if (start >= end) {
        return buffer;
    }


    const length =
        end - start + 1;


    const context =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    const newBuffer =
        context.createBuffer(
            1,
            length,
            buffer.sampleRate
        );


    const newData =
        newBuffer.getChannelData(0);


    for (
        let i = 0;
        i < length;
        i++
    ) {

        newData[i] =
            data[start + i];
    }


    return newBuffer;
}


/* ==========================================
   RMS / ENERGY
   ========================================== */

function calculateRMS(data) {

    let sum = 0;

    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        sum +=
            data[i] * data[i];
    }


    return Math.sqrt(
        sum / Math.max(1, data.length)
    );
}


/* ==========================================
   FFT
   ========================================== */

function nextPowerOfTwo(value) {

    let n = 1;

    while (n < value) {
        n *= 2;
    }

    return n;
}


function fft(real, imag) {

    const n =
        real.length;

    let j = 0;


    for (
        let i = 0;
        i < n;
        i++
    ) {

        if (i < j) {

            let temp =
                real[i];

            real[i] =
                real[j];

            real[j] =
                temp;


            temp =
                imag[i];

            imag[i] =
                imag[j];

            imag[j] =
                temp;
        }


        let m =
            n >> 1;


        while (
            m >= 1 &&
            j >= m
        ) {

            j -= m;

            m >>= 1;
        }


        j += m;
    }


    for (
        let len = 2;
        len <= n;
        len <<= 1
    ) {

        const angle =
            -2 * Math.PI / len;


        const wlenCos =
            Math.cos(angle);


        const wlenSin =
            Math.sin(angle);


        for (
            let i = 0;
            i < n;
            i += len
        ) {

            let wCos = 1;

            let wSin = 0;


            for (
                let k = 0;
                k < len / 2;
                k++
            ) {

                const uReal =
                    real[i + k];

                const uImag =
                    imag[i + k];


                const vReal =
                    real[i + k + len / 2]
                    * wCos
                    -
                    imag[i + k + len / 2]
                    * wSin;


                const vImag =
                    real[i + k + len / 2]
                    * wSin
                    +
                    imag[i + k + len / 2]
                    * wCos;


                real[i + k] =
                    uReal + vReal;

                imag[i + k] =
                    uImag + vImag;


                real[i + k + len / 2] =
                    uReal - vReal;

                imag[i + k + len / 2] =
                    uImag - vImag;


                const tempCos =
                    wCos * wlenCos
                    -
                    wSin * wlenSin;


                wSin =
                    wCos * wlenSin
                    +
                    wSin * wlenCos;


                wCos =
                    tempCos;
            }
        }
    }
}


/* ==========================================
   FIXED AUDIO FEATURES
   ========================================== */

function getAudioFeatures(buffer) {

    const trimmed =
        trimSilence(buffer);


    const data =
        trimmed.getChannelData(0);


    const sampleRate =
        trimmed.sampleRate;


    const duration =
        data.length / sampleRate;


    const rms =
        calculateRMS(data);


    const frameSize = 2048;

    const hopSize = 1024;


    /*
       Fixed five frequency bands.
       This is important because reference
       and user recordings can have different
       durations.
    */

    let bandTotals =
        [0, 0, 0, 0, 0];


    let centroidTotal = 0;

    let frameCount = 0;


    for (
        let start = 0;
        start + frameSize <= data.length;
        start += hopSize
    ) {

        const frame =
            data.slice(
                start,
                start + frameSize
            );


        const size =
            nextPowerOfTwo(
                frame.length
            );


        const real =
            new Float32Array(size);


        const imag =
            new Float32Array(size);


        for (
            let i = 0;
            i < frame.length;
            i++
        ) {

            /*
               Hann window
            */

            const window =
                0.5 -
                0.5 *
                Math.cos(
                    2 *
                    Math.PI *
                    i /
                    (frame.length - 1)
                );


            real[i] =
                frame[i] *
                window;
        }


        fft(
            real,
            imag
        );


        let magnitudeTotal = 0;

        let weightedFrequency = 0;


        for (
            let i = 0;
            i < size / 2;
            i++
        ) {

            const magnitude =
                Math.sqrt(
                    real[i] * real[i] +
                    imag[i] * imag[i]
                );


            const frequency =
                i *
                sampleRate /
                size;


            magnitudeTotal +=
                magnitude;


            weightedFrequency +=
                frequency *
                magnitude;


            /*
               Five fixed frequency bands
            */

            if (frequency < 500) {

                bandTotals[0] +=
                    magnitude;

            }
            else if (frequency < 1000) {

                bandTotals[1] +=
                    magnitude;

            }
            else if (frequency < 2000) {

                bandTotals[2] +=
                    magnitude;

            }
            else if (frequency < 4000) {

                bandTotals[3] +=
                    magnitude;

            }
            else {

                bandTotals[4] +=
                    magnitude;
            }
        }


        if (magnitudeTotal > 0) {

            centroidTotal +=
                weightedFrequency /
                magnitudeTotal;
        }


        frameCount++;
    }


    if (frameCount > 0) {

        for (
            let i = 0;
            i < bandTotals.length;
            i++
        ) {

            bandTotals[i] /=
                frameCount;
        }


        centroidTotal /=
            frameCount;
    }


    /*
       Normalize spectral bands
       so recording volume does not
       dominate the comparison.
    */

    const bandSum =
        bandTotals.reduce(
            (a, b) => a + b,
            0
        );


    let normalizedBands =
        bandTotals.map(
            value =>
                bandSum > 0
                ? value / bandSum
                : 0
        );


    /*
       Final fixed feature vector
    */

    return [

        rms,

        centroidTotal / 4000,

        /*
           Duration is gently normalized.
           This prevents duration difference
           from making a correct voice wrong.
        */

        Math.min(
            duration / 2,
            1
        ),

        ...normalizedBands
    ];
}


/* ==========================================
   COSINE SIMILARITY
   ========================================== */

function cosineSimilarity(a, b) {

    let dot = 0;

    let normA = 0;

    let normB = 0;


    const length =
        Math.min(
            a.length,
            b.length
        );


    for (
        let i = 0;
        i < length;
        i++
    ) {

        dot +=
            a[i] * b[i];


        normA +=
            a[i] * a[i];


        normB +=
            b[i] * b[i];
    }


    if (
        normA === 0 ||
        normB === 0
    ) {

        return 0;
    }


    return dot /
        (
            Math.sqrt(normA) *
            Math.sqrt(normB)
        );
}


/* ==========================================
   VOICE COMPARISON
   ========================================== */

function compareVoice(
    referenceAudio,
    userAudio
) {

    const referenceFeatures =
        getAudioFeatures(
            referenceAudio
        );


    const userFeatures =
        getAudioFeatures(
            userAudio
        );


    /*
       Normalize the RMS feature
       independently so volume difference
       does not cause a false failure.
    */

    const referenceRMS =
        Math.max(
            referenceFeatures[0],
            0.000001
        );


    const userRMS =
        Math.max(
            userFeatures[0],
            0.000001
        );


    referenceFeatures[0] = 1;

    userFeatures[0] = 1;


    /*
       Cosine similarity
    */

    let similarity =
        cosineSimilarity(
            referenceFeatures,
            userFeatures
        );


    /*
       Convert to percentage
    */

    let score =
        similarity * 100;


    /*
       Keep score in valid range
    */

    score =
        Math.max(
            0,
            Math.min(
                100,
                score
            )
        );


    console.log(
        "Reference Features:",
        referenceFeatures
    );


    console.log(
        "User Features:",
        userFeatures
    );


    console.log(
        "Cosine Similarity:",
        similarity
    );


    console.log(
        "Final Voice Score:",
        score
    );


    return score;
}


/* ==========================================
   STAR CALCULATION
   ========================================== */

function getStars(score) {

    /*
       70% or above = correct
       Correct = 3 stars
       Wrong = 0 stars
    */

    if (score >= 70) {

        return 3;
    }


    return 0;
}


/* ==========================================
   SHOW RESULT
   ========================================== */

function showResult(score) {

    const stars =
        getStars(score);


    showStarPopup(
        stars,
        score
    );
}


/* ==========================================
   CHILD FRIENDLY POPUP
   ========================================== */

function showStarPopup(
    totalStars,
    score
) {

    const overlay =
        document.getElementById(
            "starPopupOverlay"
        );


    const popupStars =
        document.getElementById(
            "popupStars"
        );


    const popupFace =
        document.getElementById(
            "popupFace"
        );


    const popupMessage =
        document.getElementById(
            "popupMessage"
        );


    const popupScore =
        document.getElementById(
            "popupScore"
        );


    if (totalStars === 3) {

        popupFace.innerHTML =
            "😄";

        popupStars.innerHTML =
            "⭐⭐⭐";

        popupMessage.innerHTML =
            "Amazing! Great Job!";

    }
    else {

        popupFace.innerHTML =
            "🤗";

        /*
           IMPORTANT:
           Wrong answer = NO STAR
        */

        popupStars.innerHTML =
            "";

        popupMessage.innerHTML =
            "Try Again!";

    }


    popupScore.innerHTML =
        "Voice Match: " +
        score.toFixed(0) +
        "%";


    overlay.style.display =
        "flex";


    /*
       Falling stars
    */

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const star =
            document.createElement(
                "div"
            );


        star.className =
            "fallingStar";


        star.innerHTML =
            totalStars === 3
            ? "⭐"
            : "✨";


        star.style.left =
            Math.random() * 100 +
            "%";


        star.style.animationDelay =
            Math.random() * 1.5 +
            "s";


        overlay.appendChild(
            star
        );


        setTimeout(
            function() {

                star.remove();

            },
            3500
        );
    }


    /*
       Sparkles
    */

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const sparkle =
            document.createElement(
                "div"
            );


        sparkle.className =
            "sparkle";


        sparkle.innerHTML =
            "✨";


        sparkle.style.left =
            Math.random() * 100 +
            "%";


        sparkle.style.animationDelay =
            Math.random() * 2 +
            "s";


        overlay.appendChild(
            sparkle
        );


        setTimeout(
            function() {
