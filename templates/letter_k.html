/* =========================================
   VOICE COMPARISON ALGORITHM
   ========================================= */

function trimSilence(buffer) {

    const data = buffer.getChannelData(0);
    const threshold = 0.008;

    let start = 0;
    let end = data.length - 1;

    while (
        start < data.length &&
        Math.abs(data[start]) < threshold
    ) {
        start++;
    }

    while (
        end > start &&
        Math.abs(data[end]) < threshold
    ) {
        end--;
    }

    if (start >= end) {
        return buffer;
    }

    const length = end - start + 1;

    const context =
        new (window.AudioContext || window.webkitAudioContext)();

    const newBuffer =
        context.createBuffer(
            1,
            length,
            buffer.sampleRate
        );

    const newData =
        newBuffer.getChannelData(0);

    for (let i = 0; i < length; i++) {
        newData[i] = data[start + i];
    }

    return newBuffer;
}


/* =========================================
   FFT
   ========================================= */

function nextPow2(value) {

    let n = 1;

    while (n < value) {
        n *= 2;
    }

    return n;
}


function fft(real, imag) {

    const n = real.length;
    let j = 0;

    for (let i = 0; i < n; i++) {

        if (i < j) {

            let temp = real[i];
            real[i] = real[j];
            real[j] = temp;

            temp = imag[i];
            imag[i] = imag[j];
            imag[j] = temp;
        }

        let m = n >> 1;

        while (m >= 1 && j >= m) {
            j -= m;
            m >>= 1;
        }

        j += m;
    }

    for (
        let len = 2;
        len <= n;
        len <<= 1
    ) {

        const angle = -2 * Math.PI / len;

        const wlenCos = Math.cos(angle);
        const wlenSin = Math.sin(angle);

        for (
            let i = 0;
            i < n;
            i += len
        ) {

            let wCos = 1;
            let wSin = 0;

            for (
                let k = 0;
                k < len / 2;
                k++
            ) {

                const uReal = real[i + k];
                const uImag = imag[i + k];

                const vReal =
                    real[i + k + len / 2] * wCos -
                    imag[i + k + len / 2] * wSin;

                const vImag =
                    real[i + k + len / 2] * wSin +
                    imag[i + k + len / 2] * wCos;

                real[i + k] = uReal + vReal;
                imag[i + k] = uImag + vImag;

                real[i + k + len / 2] =
                    uReal - vReal;

                imag[i + k + len / 2] =
                    uImag - vImag;

                const tempCos =
                    wCos * wlenCos -
                    wSin * wlenSin;

                wSin =
                    wCos * wlenSin +
                    wSin * wlenCos;

                wCos = tempCos;
            }
        }
    }
}


/* =========================================
   AUDIO FEATURES
   ========================================= */

function getAudioFeatures(buffer) {

    const trimmed = trimSilence(buffer);

    const data = trimmed.getChannelData(0);

    const sampleRate = trimmed.sampleRate;

    const frameSize = 2048;
    const hopSize = 1024;

    /* RMS */

    let rmsSum = 0;

    for (let i = 0; i < data.length; i++) {

        rmsSum += data[i] * data[i];
    }

    const rms =
        Math.sqrt(
            rmsSum / Math.max(1, data.length)
        );


    /* Duration */

    const duration =
        data.length / sampleRate;


    /* Frequency bands */

    let bands = [0, 0, 0, 0, 0];

    let centroidTotal = 0;
    let frameCount = 0;


    for (
        let start = 0;
        start + frameSize <= data.length;
        start += hopSize
    ) {

        const frame =
            data.slice(
                start,
                start + frameSize
            );

        const size =
            nextPow2(frame.length);

        const real =
            new Float32Array(size);

        const imag =
            new Float32Array(size);


        /* Hann Window */

        for (
            let i = 0;
            i < frame.length;
            i++
        ) {

            const window =
                0.5 -
                0.5 *
                Math.cos(
                    2 *
                    Math.PI *
                    i /
                    (frame.length - 1)
                );

            real[i] =
                frame[i] * window;
        }


        fft(real, imag);


        let magnitudeTotal = 0;
        let weightedFrequency = 0;


        for (
            let i = 0;
            i < size / 2;
            i++
        ) {

            const magnitude =
                Math.sqrt(
                    real[i] * real[i] +
                    imag[i] * imag[i]
                );

            const frequency =
                i * sampleRate / size;

            magnitudeTotal += magnitude;

            weightedFrequency +=
                frequency * magnitude;


            if (frequency < 500) {

                bands[0] += magnitude;

            } else if (frequency < 1000) {

                bands[1] += magnitude;

            } else if (frequency < 2000) {

                bands[2] += magnitude;

            } else if (frequency < 4000) {

                bands[3] += magnitude;

            } else {

                bands[4] += magnitude;
            }
        }


        if (magnitudeTotal > 0) {

            centroidTotal +=
                weightedFrequency /
                magnitudeTotal;
        }

        frameCount++;
    }


    if (frameCount > 0) {

        for (
            let i = 0;
            i < bands.length;
            i++
        ) {

            bands[i] /= frameCount;
        }

        centroidTotal /= frameCount;
    }


    /* Normalize bands */

    const bandTotal =
        bands.reduce(
            function(sum, value) {
                return sum + value;
            },
            0
        );


    if (bandTotal > 0) {

        bands =
            bands.map(
                function(value) {
                    return value / bandTotal;
                }
            );
    }


    return [
        rms,
        centroidTotal / 4000,
        duration,
        ...bands
    ];
}


/* =========================================
   COSINE SIMILARITY
   ========================================= */

function cosineSimilarity(a, b) {

    let dot = 0;
    let normA = 0;
    let normB = 0;

    const length =
        Math.min(a.length, b.length);


    for (
        let i = 0;
        i < length;
        i++
    ) {

        dot += a[i] * b[i];

        normA += a[i] * a[i];

        normB += b[i] * b[i];
    }


    if (
        normA === 0 ||
        normB === 0
    ) {

        return 0;
    }


    return dot /
        (
            Math.sqrt(normA) *
            Math.sqrt(normB)
        );
}


/* =========================================
   COMPARE REFERENCE VOICE
   WITH USER VOICE
   ========================================= */

function compareVoice(
    referenceAudio,
    userAudio
) {

    const referenceFeatures =
        getAudioFeatures(referenceAudio);

    const userFeatures =
        getAudioFeatures(userAudio);


    /*
       Ignore volume difference.
    */

    referenceFeatures[0] = 1;
    userFeatures[0] = 1;


    /*
       Normalize duration.
    */

    referenceFeatures[2] =
        Math.min(
            referenceFeatures[2] / 2,
            1
        );

    userFeatures[2] =
        Math.min(
            userFeatures[2] / 2,
            1
        );


    const similarity =
        cosineSimilarity(
            referenceFeatures,
            userFeatures
        );


    let score =
        similarity * 100;


    score =
        Math.max(
            0,
            Math.min(100, score)
        );


    console.log(
        "Reference Features:",
        referenceFeatures
    );

    console.log(
        "User Features:",
        userFeatures
    );

    console.log(
        "K Voice Score:",
        score.toFixed(2) + "%"
    );


    return score;
}


/* =========================================
   STAR RESULT
   ========================================= */

function getStars(score) {

    if (score >= 70) {
        return 3;
    }

    return 0;
}
